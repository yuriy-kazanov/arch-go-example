version: 1
threshold:
  compliance: 100
dependenciesRules:
  - package: "**.adapter.**"
    shouldOnlyDependsOn:
      internal:
        - "**.service"
        - "**.model.**"
  - package: "**.adapter.**"
    shouldNotDependsOn:
      internal:
        - "**.service.**"
  - package: "**.service.**"
    shouldOnlyDependsOn:
      internal:
        - "**.model.**"
      external:
        - "go.opentelemetry.io/otel"
  - package: "**.service.**"
    shouldNotDependsOn:
      internal:
        - "**.adapter.**"
      external:
        - "github.com/jackc/pgx/v5"
contentsRules:
  - package: "**.service"
    shouldOnlyContainInterfaces: true
